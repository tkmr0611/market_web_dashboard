# ダッシュボードに表示する指標の一覧。上から順に表示されます。
# 追加するときは [[indicators]] ブロックを 1 つ足すだけです。
#
# source   yahoo  … Yahoo Finance のティッカー（例: ^N225, JPY=X, ^TNX）
#          fred   … FRED の系列 ID（https://fred.stlouisfed.org/ で検索）
#          mof    … 財務省「国債金利情報」の列名（1年, 2年, … 40年）
#          mof_tb … 財務省「国庫短期証券の入札結果」の年限（3か月, 6か月, 1年）。入札ごと（ほぼ週次）
#          boj    … 日銀 時系列統計の「DB名/系列コード」（例: FM01/STRDCLUCON）
#          ecb    … ECB Data Portal の「データセット/系列キー」（例: FM/D.U2.EUR.4F.KR.DFR.LEV）
#          spread … 2 系列の差（1 本目 − 2 本目）。legs に上の取得元での指定を 2 つ書く
# country  [countries] のキー。国ごとにカードが分かれます
# category 国カード内の小見出し（初出順に並びます）
# change   pct  … 前回比を % と値幅で表示（株価・為替向け）
#          bp   … 前回比を bp（0.01%）で表示（金利向け）
#          diff … 前回比を値の差で表示（失業率など）
# unit     値の後ろに付ける単位（省略可）
# decimals 表示する小数点以下の桁数
# note     詳細欄に出す注記（省略可）

history_years = 5   # チャート用に取得する期間

[countries]
JP = "日本"
US = "米国"
EU = "欧州"

# ================================================================ 日本

# ---------------------------------------------------------------- 株価指数

[[indicators]]
id = "nikkei225"
name = "日経平均株価"
country = "JP"
category = "株価指数"
source = "yahoo"
symbol = "^N225"
decimals = 2
change = "pct"

[[indicators]]
id = "topix_etf"
name = "TOPIX連動ETF (1306)"
country = "JP"
category = "株価指数"
source = "yahoo"
symbol = "1306.T"
unit = "円"
decimals = 1
change = "pct"
note = "TOPIX 指数そのものは無料で安定して取れる配信元が無いため、連動 ETF の価格で代用しています（騰落率はほぼ一致）。"

