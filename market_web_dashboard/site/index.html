<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12 5 7l3 3 7-8' fill='none' stroke='%232a78d6' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Market Dashboard</h1>
    <span id="updated" class="updated">読み込み中…</span>
    <div class="range" role="group" aria-label="チャートの期間">
      <button type="button" data-range="1M">1M</button>
      <button type="button" data-range="3M">3M</button>
      <button type="button" data-range="1Y">1Y</button>
      <button type="button" data-range="5Y">5Y</button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="footer">
    出典: Yahoo Finance / FRED（セントルイス連銀）/ 財務省。GitHub Actions で 1 時間ごとに取得。値には配信元による遅延があります。
    行をクリックすると大きいチャートを表示します。
  </footer>
  <div id="tip" class="tip" hidden><strong></strong><span></span></div>
</body>
</html>
